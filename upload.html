<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGSCAN - Upload Logs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .upload-zone {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #f8f9ff;
        }
        .upload-zone.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }
        .upload-zone p {
            color: #666;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .upload-zone .large {
            font-size: 20px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }
        input[type="file"] {
            display: none;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }
        .status.show {
            display: block;
        }
        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #1976d2;
        }
        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            border: 1px solid #388e3c;
        }
        .status.error {
            background: #ffebee;
            color: #d32f2f;
            border: 1px solid #d32f2f;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            animation: progress 2s ease-in-out infinite;
            width: 30%;
        }
        @keyframes progress {
            0% { width: 10%; }
            50% { width: 60%; }
            100% { width: 90%; }
        }
        .status-details {
            font-size: 12px;
            margin-top: 8px;
            opacity: 0.8;
            font-style: italic;
        }
        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 6px;
            display: none;
        }
        .results.show {
            display: block;
        }
        .results h3 {
            color: #333;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .result-item {
            background: white;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #667eea;
        }
        .result-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .result-value {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-top: 4px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-buttons .btn {
            padding: 10px 16px;
            font-size: 13px;
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #bdbdbd;
        }
        .btn-success {
            background: #4caf50;
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            background: #45a049;
        }
        .file-name {
            margin-top: 10px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 LOGSCAN</h1>
        <p class="subtitle">Upload your server logs for instant security analysis</p>

        <div class="upload-zone" id="uploadZone">
            <div class="large">📁 Drag & Drop</div>
            <p>Drop your log file here or click to select</p>
            <p style="font-size: 12px; margin-top: 8px; opacity: 0.7;">Supports: .log, .txt, .gz, .zip</p>
            <input type="file" id="fileInput" accept=".log,.txt,.gz,.zip">
        </div>
        <div class="file-name" id="fileName"></div>

        <div class="btn-group">
            <button class="btn btn-primary" id="selectBtn">Select File</button>
            <button class="btn btn-primary" id="uploadBtn" disabled>Upload & Analyze</button>
        </div>

        <div class="status" id="status"></div>

        <div class="results" id="results">
            <h3>Analysis Results</h3>
            <div class="results-grid" id="resultsGrid"></div>
            <div class="action-buttons">
                <button class="btn btn-success" id="uploadAnother" style="background: #4caf50;">✅ Upload Another Log</button>
            </div>
        </div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const selectBtn = document.getElementById('selectBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        const resultsGrid = document.getElementById('resultsGrid');
        const fileName = document.getElementById('fileName');
        const uploadAnother = document.getElementById('uploadAnother');

        let selectedFile = null;

        // File selection
        selectBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                selectedFile = files[0];
                fileName.textContent = `Selected: ${selectedFile.name}`;
                uploadBtn.disabled = false;
            }
        });

        // Drag and drop
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                selectedFile = files[0];
                fileInput.files = files;
                fileName.textContent = `Selected: ${selectedFile.name}`;
                uploadBtn.disabled = false;
            }
        });

        // Upload
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('files', selectedFile);

            // Show loading with progress
            const fileName = selectedFile.name;
            const fileSize = (selectedFile.size / 1024 / 1024).toFixed(1);
            status.className = 'status show loading';
            status.innerHTML = `
                <div style="display: flex; align-items: center; margin-bottom: 8px;">
                    <span class="spinner"></span>
                    <div style="margin-left: 8px;">
                        <div><strong>Uploading:</strong> ${fileName}</div>
                        <div class="status-details">${fileSize} MB - Processing with parallel analysis...</div>
                    </div>
                </div>
                <div class="progress-bar"><div class="progress-fill"></div></div>
            `;
            results.classList.remove('show');
            uploadBtn.disabled = true;
            selectBtn.disabled = true;

            const startTime = Date.now();

            try {
                // Add timeout after 2 minutes
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 120000);

                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                const duration = ((Date.now() - startTime) / 1000).toFixed(1);

                // Show success
                status.className = 'status show success';
                status.innerHTML = `✅ Analysis complete in ${duration}s! Check the results below.`;

                // Display results
                displayResults(data);

            } catch (error) {
                const duration = ((Date.now() - startTime) / 1000).toFixed(1);
                status.className = 'status show error';

                if (error.name === 'AbortError') {
                    status.innerHTML = `❌ Timeout after ${duration}s. Log file might be too large or server is busy.`;
                } else {
                    status.innerHTML = `❌ Error (${duration}s): ${error.message}`;
                }

                uploadBtn.disabled = false;
                selectBtn.disabled = false;
            }
        });

        function displayResults(data) {
            const summary = data.summary || data;
            const datasetId = data.dataset_id;

            const items = [
                { label: 'Total Requests', value: summary.total || 0 },
                { label: 'Unique IPs', value: summary.unique_ips || 0 },
                { label: 'Unique Paths', value: summary.unique_paths || 0 },
                { label: 'Total Bandwidth', value: formatBytes(summary.bandwidth || 0) },
                { label: 'Threat Level', value: summary.threat_level || 'Low' },
                { label: 'Status Codes', value: (summary.status && Object.keys(summary.status).length) || 0 }
            ];

            resultsGrid.innerHTML = items
                .map(item => `
                    <div class="result-item">
                        <div class="result-label">${item.label}</div>
                        <div class="result-value">${item.value}</div>
                    </div>
                `)
                .join('');

            // Update dashboard link to pass dataset_id
            if (datasetId) {
                const dashboardLink = resultsGrid.parentElement.querySelector('a[href="/dashboard"]');
                if (dashboardLink) {
                    dashboardLink.href = `/dashboard?id=${datasetId}`;
                }
            }

            results.classList.add('show');
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        uploadAnother.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            fileName.textContent = '';
            uploadBtn.disabled = true;
            selectBtn.disabled = false;
            status.classList.remove('show');
            results.classList.remove('show');
        });
    </script>
</body>
</html>
